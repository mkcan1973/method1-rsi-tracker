name: Run method1 RSI Tracker

"on":
  schedule:
    # Once daily, weekdays only -- the signal is based on daily closing
    # prices (RSI computed from each day's close), so there's no benefit
    # to running more than once/day; it literally can't change until the
    # next close exists.
    # ~20:4x UTC = 4:4xpm EDT (after the 4pm ET close) / 3:4xpm EST
    # (BEFORE the 4pm ET close -- cron is fixed UTC and doesn't shift for
    # US daylight saving) -- not worth a second seasonal cron for that.
    # Minute deliberately NOT :00/:15/:30/:45: GitHub's scheduler queues
    # workflows behind everyone else's at those popular marks, and this
    # repo's runs were landing 4-6+ hours late by early Nov 2026 sitting
    # on :30. An odd minute doesn't guarantee punctuality -- GitHub's
    # cron is "best effort," full stop -- but it's queued behind less.
    - cron: "41 20 * * 1-5"
  workflow_dispatch: {}  # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan (refreshes data + today's RSI scan)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scan.py

      - name: Prune database to trailing window
        run: python prune.py

      - name: Rebuild web dashboard
        run: |
          python web_summary.py
          cp web_summary.html index.html

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add method1.sqlite3 scan_results.csv trade_log_12mo.csv web_summary.html index.html sp500_constituents.json trailing_eps_cache.json russell2000_constituents.json
          git diff --staged --quiet || git commit -m "Run: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
